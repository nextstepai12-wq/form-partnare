section{padding:76px 0;border-top:1px solid var(--line)}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.25rem Manrope,sans-serif;direction:ltr}
.brand img{height:40px;width:40px}.brand em{font-style:normal;color:var(--cyan)}
.nl{display:flex;gap:26px}.nl a{color:var(--mut);font-weight:500;text-decoration:none}.nl a:hover{color:var(--blue)}
.act{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;gap:10px;align-items:center;justify-content:center;padding:12px 26px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:1rem;font-family:inherit;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(37,99,235,.28);background:#1d4ed8}

.btn.sm{padding:8px 16px;font-size:.9rem}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;padding:56px 0 76px;border:0}
.tag{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--mut);font-size:.9rem;font-weight:500;margin-bottom:20px}
.tag .ic{color:var(--blue)}
.hero p{max-width:520px;margin:20px 0 28px;color:var(--mut);font-size:1.12rem}

.vis{perspective:900px}

.three>div{padding:6px 26px;border-inline-start:1px solid var(--line)}.three>div:first-child{border:0;padding-inline-start:0}
.ico{width:52px;height:52px;border-radius:14px;background:#EAF1FF;color:var(--blue);display:grid;place-items:center;margin-bottom:14px;transition:background .3s,color .3s,transform .3s}
.three>div:hover .ico{background:var(--blue);color:#fff;transform:translateY(-3px)}
h3{font-family:Tajawal,Manrope,sans-serif;font-size:1.2rem;font-weight:800;margin-bottom:4px}
.mut{color:var(--mut)}
.lead{max-width:700px;font-size:1.1rem;color:var(--mut);margin-bottom:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:26px}
.box h3{margin-bottom:12px}
.box ul{list-style:none;padding:0;display:grid;gap:10px}
.box li{display:flex;gap:10px;align-items:flex-start}
.y .ic{color:#059669}.n .ic{color:#dc2626}.y h3{color:#059669}.n h3{color:#dc2626}
.bar{display:flex;gap:4px;height:14px;margin-bottom:26px}
.bar i{border-radius:4px;background:var(--blue);opacity:.35;transition:opacity .3s}.bar i:nth-child(odd){background:var(--cyan)}.bar:hover i{opacity:.35}.bar i:hover{opacity:1}
.tl{list-style:none;padding:0;display:grid;gap:0}
.tl li{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl b{min-width:54px;font:800 1.1rem Manrope,sans-serif;color:var(--blue)}
.tot{margin-top:16px;display:flex;gap:8px;align-items:center;font-weight:700}
.st{list-style:none;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.st li{counter-increment:s;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px;transition:transform .25s}
.st li:hover{transform:translateY(-4px)}
.st li:before{content:"0" counter(s);display:block;font:800 1.7rem Manrope,sans-serif;color:var(--blue);margin-bottom:6px}
.st .ic{color:var(--blue);margin-inline-end:6px;vertical-align:-3px}
.meet{margin-top:22px;display:flex;gap:10px;align-items:center;padding:16px 20px;border:1px dashed #94a3b8;border-radius:16px;font-weight:700}
.meet .ic{color:var(--blue)}
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:center}
.about img{width:100%;border-radius:26px;display:block;box-shadow:0 24px 50px rgba(37,99,235,.15)}
form{display:grid;gap:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:0 20px 50px rgba(11,18,32,.06)}
fieldset{border:0;display:grid;gap:14px;padding:0}
legend{font-weight:800;color:var(--blue);margin-bottom:8px;font-size:.95rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:5px;font-weight:700;font-size:.92rem}
label small{font-weight:400;color:#64748b}
input,textarea{font:inherit;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:12px;background:#fff;width:100%;transition:border-color .2s,box-shadow .2s}
input:hover,textarea:hover{border-color:#94a3b8}
input:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:500}.ck input{width:auto;margin-top:8px}
#msg{font-weight:700}
footer{background:var(--ink);color:#cbd5e1;padding:56px 0 34px}
.fc{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.fc img{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#1e293b;box-shadow:0 0 0 4px var(--ink),0 0 0 6px var(--cyan)}
.fc b{color:#fff;font-size:1.15rem;display:block}
.fc nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fc a{display:inline-flex;gap:8px;align-items:center;color:#fff;font-weight:500;text-decoration:none;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.08);transition:background .2s}
.fc a:hover{background:var(--blue)}
.cp{margin-top:34px;padding-top:20px;border-top:1px solid #1e293b;font-size:.85rem;color:#94a3b8}
html.js .rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}html.js .rv.in{opacity:1;transform:none}
@media(max-width:820px){.nl{display:none}.hero,.about,.two,.three,.st,.g2{grid-template-columns:1fr}.three>div{border:0;padding:0 0 22px}.stats{gap:22px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>

<section id="idea">
<div class="sec"><i>01</i><h2 data-ar="لماذا دُعيتم إلى هذه الطاولة؟" data-en="Why were you invited to this table?"></h2></div>
<p class="lead rv" data-ar="كل فريق منكم بنى مشروعًا حقيقيًا في ظروف صعبة، وكل مشروع يملك ما يحتاجه غيره: مهارة، أو خبرة، أو علاقة، أو فكرة. لذلك نجمعكم لتتعارفوا وجهًا لوجه، لا لنقارن مشروعًا بآخر." data-en="Each of you built a real project under difficult conditions, and every project holds something another one needs: a skill, an experience, a connection, or an idea. So we bring you together to meet face to face, not to compare one project with another."></p>
<div class="three rv">
<div><div class="ico"><svg class="ic"><use href="#i-users"/></svg></div><h3 data-ar="تعارف حقيقي" data-en="A real introduction"></h3><p class="mut" data-ar="تتعرّف القيادات على بعضها: من أنتم، وماذا بنيتم، وما الذي يشغلكم." data-en="Leaders get to know each other: who you are, what you built, and what drives you."></p></div>
<div><div class="ico"><svg class="ic"><use href="#i-link"/></svg></div><h3 data-ar="سبل التعاون" data-en="Ways to collaborate"></h3><p class="mut" data-ar="نبحث معًا أين يكمّل مشروعٌ مشروعًا آخر، وما الذي يمكن أن نبنيه سويًا." data-en="Together we look for where one project completes another, and what we could build side by side."></p></div>
<div><div class="ico"><svg class="ic"><use href="#i-globe"/></svg></div><h3 data-ar="صوت واحد من غزة" data-en="One voice from Gaza"></h3><p class="mut" data-ar="حين نتعاون، يصبح صوتنا أقوى عند المجتمع والطلبة والشركاء وأمام العالم." data-en="When we collaborate, our voice grows stronger with the community, students, partners, and the world."></p></div>
</div>
</section>

<li><svg class="ic"><use href="#i-check"/></svg><span data-ar="مساحة لتبادل التجارب والدروس" data-en="A space to share experiences and lessons"></span></li>
<li><svg class="ic"><use href="#i-check"/></svg><span data-ar="بحث عملي في فرص التعاون" data-en="A practical search for collaboration opportunities"></span></li>
<li><svg class="ic"><use href="#i-check"/></svg><span data-ar="بداية علاقة تستمر بعد اللقاء" data-en="The start of a relationship that lasts beyond the meeting"></span></li></ul></div>

<div class="rv">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
document.documentElement.classList.add('js');
const SB_URL='https://fwlwkshvrxhctplfbdfq.supabase.co',SB_KEY='sb_publishable__YvkD5iBjpu6BCFnrjkeAQ_kWc0QPYk';
const sb=SB_URL.startsWith('http')?supabase.createClient(SB_URL,SB_KEY):null;
let L='ar',S={};
const M={
 ok:{ar:'وصلنا طلبكم. سنراجعه، وإن كان مناسبًا نرسل لكم بريدًا إلكترونيًا برابط الانضمام.',en:'We received your application. We will review it and, if it is a good fit, email you the link to join.'},
 dup:{ar:'هذا البريد الإلكتروني مسجّل لدينا من قبل.',en:'This email is already registered with us.'},
 err:{ar:'تعذّر إرسال الطلب. تحقق من الاتصال وحاول مرة أخرى.',en:'Could not send the application. Check your connection and try again.'},
 none:{ar:'سيُعلن الموعد والمكان للفرق المقبولة عبر البريد الإلكتروني.',en:'The date and place will be announced to accepted teams by email.'}
};
function apply(){
 document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
 document.getElementById('lb').textContent=L=='ar'?'EN':'AR';
 document.querySelectorAll('[data-ar]').forEach(e=>e.textContent=e.dataset[L]);
 document.getElementById('mt').textContent=S.meeting_at?(L=='ar'?'موعد اللقاء: ':'Meeting: ')+new Date(S.meeting_at).toLocaleString(L=='ar'?'ar':'en-GB',{dateStyle:'full',timeStyle:'short'})+(S.place?' — '+S.place:''):M.none[L];
}
function setL(l){L=l;apply()}
apply();
(async()=>{
 if(sb){const{data}=await sb.from('rt_settings').select('*').eq('id',1).maybeSingle();if(data){S=data;apply()}}
})();

const f=document.getElementById('f'),msg=document.getElementById('msg');
f.onsubmit=async e=>{
 e.preventDefault();
 const d={};
 new FormData(f).forEach((v,k)=>d[k]=String(v).trim());
 d.consent=f.consent.checked;
 if(!d.collab_ideas)d.collab_ideas=null;
 const{error}=sb?await sb.from('rt_applications').insert(d):{error:{}};
 msg.textContent=M[error?(error.code=='23505'?'dup':'err'):'ok'][L];
 msg.style.color=error?'#dc2626':'#059669';
 if(!error)f.reset();
};

const nv=document.getElementById('nv');
addEventListener('scroll',()=>nv.classList.toggle('s',scrollY>10),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
const fr=document.getElementById('fr');
fr.parentNode.onpointermove=e=>{const r=fr.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;fr.style.transform='rotateY('+x*10+'deg) rotateX('+-y*10+'deg)'};
fr.parentNode.onpointerleave=()=>fr.style.transform='';

const cv=document.getElementById('bg'),cx=cv.getContext('2d'),dpr=devicePixelRatio||1,P=[],red=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,mx=0,my=0,tx=0,ty=0,a=0;
function rs(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
rs();addEventListener('resize',rs);
for(let i=0;i<70;i++)P.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*2-1,c:i%3?'37,99,235':'6,182,212'});
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
function draw(){
 mx+=(tx-mx)*.05;my+=(ty-my)*.05;a+=.0012;
 cx.clearRect(0,0,W,H);
 const c=Math.cos(a+mx*2),s=Math.sin(a+mx*2),c2=Math.cos(my*1.2),s2=Math.sin(my*1.2),R=Math.min(W,H)*.85,Q=[],D=R*.2;
 for(const p of P){const x=p.x*c-p.z*s;let z=p.x*s+p.z*c;const y=p.y*c2-z*s2;z=p.y*s2+z*c2;const k=1.6/(2.4+z);Q.push([W/2+x*R*k,H/2+y*R*k,k,p.c])}
 for(let i=0;i<Q.length;i++)for(let j=i+1;j<Q.length;j++){
  const d=Math.hypot(Q[i][0]-Q[j][0],Q[i][1]-Q[j][1]);
  if(d<D){cx.strokeStyle='rgba(37,99,235,'+(1-d/D)*.25+')';cx.lineWidth=dpr;cx.beginPath();cx.moveTo(Q[i][0],Q[i][1]);cx.lineTo(Q[j][0],Q[j][1]);cx.stroke()}
 }
 for(const q of Q){cx.fillStyle='rgba('+q[3]+','+(.3+q[2]*.35)+')';cx.beginPath();cx.arc(q[0],q[1],q[2]*3.5*dpr,0,6.3);cx.fill()}
 if(!red)requestAnimationFrame(draw);
}
draw();
</script>
